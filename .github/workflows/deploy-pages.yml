name: Deploy Traveler.dev to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -e
          test -f public/index.html
          mkdir -p _site
          cp -R public/. _site/
          test -s _site/index.html

          # GitHub Pages must not receive Cloudflare Functions.
          rm -rf _site/functions

          # Prevent Jekyll from modifying the application.
          touch _site/.nojekyll

          echo "Static site:"
          find _site -maxdepth 2 -type f -print
          echo
          echo "index.html:"
          wc -c _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
