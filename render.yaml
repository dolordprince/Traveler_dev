services:
  - type: web
    name: traveler-dev
    runtime: node
    buildCommand: npm install && npx tsc --project tsconfig.gateway.json
    startCommand: node dist/gateway/studio.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
